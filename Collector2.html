<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>Dettes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap');
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f0;--muted:#888;--faint:#444;
  --accent:#e8c84a;--accent-dim:rgba(232,200,74,0.1);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.1);
  --red:#f87171;--red-dim:rgba(248,113,113,0.1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;overscroll-behavior:none}

/* Layout */
#app{display:flex;flex-direction:column;height:100dvh}
#hdr{padding:16px 16px 12px;background:var(--bg);border-bottom:.5px solid var(--border);flex-shrink:0}
#hdr h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
#hdr p{font-size:12px;color:var(--muted);margin-top:2px}
#content{flex:1;overflow-y:auto;padding:14px 14px;padding-bottom:calc(72px + var(--safe-b))}

/* Metrics */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.mcard{background:var(--bg2);border:.5px solid var(--border);border-radius:12px;padding:12px 14px}
.mcard.wide{grid-column:span 2}
.mlabel{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.mval{font-size:20px;font-weight:600;font-family:'DM Mono',monospace}
.cy{color:var(--accent)}.cg{color:var(--green)}.cr{color:var(--red)}

/* Person cards */
.person-card{background:var(--bg2);border:.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.person-header{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer}
.person-name{font-size:16px;font-weight:600}
.person-meta{font-size:12px;color:var(--muted);margin-top:3px}
.person-totals{text-align:right;flex-shrink:0;margin-left:12px}
.person-due{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.person-margin{font-size:11px;color:var(--green);margin-top:2px}
.person-paid{color:var(--muted);text-decoration:line-through}
.expand-btn{font-size:11px;color:var(--faint);margin-top:6px}

/* Debts list */
.debts-list{border-top:.5px solid var(--border);display:none}
.debts-list.open{display:block}
.debt-row{padding:11px 14px;border-bottom:.5px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.debt-row:last-child{border-bottom:none}
.debt-label{font-size:13px;font-weight:500}
.debt-note{font-size:11px;color:var(--muted);margin-top:2px}
.debt-amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;text-align:right}
.debt-cost{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.debt-margin{font-size:11px;color:var(--green);text-align:right}
.debt-status{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.paid-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;background:var(--green-dim);color:var(--green)}
.partial-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;background:var(--accent-dim);color:var(--accent)}
.ibtn{width:28px;height:28px;border-radius:7px;border:.5px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn svg{width:13px;height:13px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ibtn.cr{color:var(--red);border-color:rgba(248,113,113,.25)}
.ibtn.cg{color:var(--green);border-color:rgba(74,222,128,.25)}
.ibtn.cy{color:var(--accent);border-color:rgba(232,200,74,.25)}

/* Person actions bar */
.person-actions{padding:8px 14px 12px;display:flex;gap:8px}
.pact-btn{flex:1;padding:9px;border-radius:9px;border:.5px solid var(--border2);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;text-align:center}
.pact-btn.add{color:var(--accent);border-color:rgba(232,200,74,.3)}
.pact-btn.pay{color:var(--green);border-color:rgba(74,222,128,.3)}
.pact-btn.del{color:var(--red);border-color:rgba(248,113,113,.2)}

/* FAB */
.fab{position:fixed;bottom:calc(74px + var(--safe-b));right:16px;width:52px;height:52px;border-radius:16px;background:var(--accent);color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,200,74,.35);z-index:40}
.fab svg{width:24px;height:24px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;line-height:1.8}
.empty-ico{font-size:40px;margin-bottom:10px}

/* Bottom sheets */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none}
.sbg.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;border-top:.5px solid var(--border2);z-index:101;padding:0 16px;padding-bottom:calc(16px + var(--safe-b));max-height:92dvh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sbg.open .sheet{transform:translateY(0)}
.shandle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 16px}
.stitle{font-size:17px;font-weight:600;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;background:var(--bg3);border:.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bfull{width:100%;padding:15px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px}
.bfull.green{background:var(--green)}
.bcancel{width:100%;padding:13px;background:var(--bg3);color:var(--muted);border:none;border-radius:12px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:8px}
.info-box{background:var(--bg3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.info-box strong{color:var(--text)}

/* Bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(56px + var(--safe-b));background:var(--bg2);border-top:.5px solid var(--border);display:flex;padding-bottom:var(--safe-b);z-index:50}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--faint);font-size:9px;font-family:inherit;font-weight:500;cursor:pointer;padding:8px 0;transition:color .15s}
.nb.active{color:var(--accent)}
.nb svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Sections */
.sec{display:none}.sec.active{display:block}

/* Coffre */
.coffre-total{background:var(--bg2);border:.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
.coffre-total-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.coffre-total-val{font-size:32px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.coffre-card{background:var(--bg2);border:.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.coffre-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.coffre-name{font-size:15px;font-weight:600}
.coffre-cost{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.coffre-detail{margin-top:10px;border-top:.5px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.coffre-debt-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.coffre-debt-label{color:var(--muted);flex:1;margin-right:8px}
.coffre-debt-cost{font-family:'DM Mono',monospace;color:var(--text);font-size:12px}
.coffre-bar-wrap{height:6px;background:var(--bg3);border-radius:99px;margin-top:8px;overflow:hidden}
.coffre-bar{height:100%;border-radius:99px;background:var(--red);transition:width .4s ease}
.coffre-margin-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:.5px solid var(--border);font-size:12px}
.coffre-margin-label{color:var(--muted)}
.coffre-margin-val{font-family:'DM Mono',monospace;color:var(--green);font-weight:600}
.empty-coffre{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

/* Nav */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(58px + var(--safe-b));background:var(--bg2);border-top:.5px solid var(--border);display:flex;padding-bottom:var(--safe-b);z-index:50}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--faint);font-size:10px;font-family:inherit;font-weight:500;cursor:pointer;padding:8px 0}
.nb.active{color:var(--accent)}
.nb svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sec{display:none}.sec.active{display:block}
/* Coffre */
.coffre-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coffre-title{font-size:14px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.date-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.date-chips::-webkit-scrollbar{display:none}
.dchip{flex-shrink:0;padding:5px 12px;border-radius:99px;border:.5px solid var(--border2);background:var(--bg2);color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.dchip.active{background:var(--accent-dim);border-color:rgba(232,200,74,.4);color:var(--accent)}
.coffre-person{background:var(--bg2);border:.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.cp-row{display:flex;justify-content:space-between;align-items:center}
.cp-name{font-size:14px;font-weight:600}
.cp-cost{font-family:'DM Mono',monospace;font-size:16px;font-weight:600;color:var(--red)}
.cp-detail{font-size:12px;color:var(--muted);margin-top:4px}
.cp-bar-wrap{height:6px;background:var(--bg3);border-radius:3px;margin-top:10px;overflow:hidden}
.cp-bar{height:100%;background:var(--red);border-radius:3px;transition:width .4s ease}

.backup-bar{display:flex;gap:8px;margin-bottom:14px}
.backup-btn{flex:1;padding:10px;border-radius:10px;border:.5px solid var(--border2);background:var(--bg3);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:center}
.backup-btn.exp{color:var(--green);border-color:rgba(74,222,128,.3)}
.backup-btn.imp{color:var(--accent);border-color:rgba(232,200,74,.3)}
#import-file{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <h1>💸 Dettes</h1>
    <p id="hsub">Chargement...</p>
  </div>
  <div id="content">
    <!-- Dettes section -->
    <div class="sec active" id="tab-dettes">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="pact-btn" style="flex:1;color:var(--green);border-color:rgba(74,222,128,.3)" onclick="exportBackup()">⬇ Exporter</button>
        <button class="pact-btn" style="flex:1;color:var(--accent);border-color:rgba(232,200,74,.3)" onclick="document.getElementById('import-file').click()">⬆ Importer</button>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)"/>
      <div class="mgrid" id="metrics"></div>
      <div id="persons-list"></div>
    </div>
    <!-- Coffre section -->
    <div class="sec" id="tab-coffre">
      <div class="coffre-total">
        <div class="coffre-total-label">💰 Total avancé de ma poche</div>
        <div class="coffre-total-val" id="coffre-grand-total">0,00 €</div>
      </div>
      <div id="coffre-list"></div>
    </div>
  </div>
  <nav id="nav">
    <button class="nb active" id="nb-dettes" onclick="showTab('dettes',this)">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Dettes
    </button>
    <button class="nb" id="nb-coffre" onclick="showTab('coffre',this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      Coffre
    </button>
  </nav>
</div>

<button class="fab" onclick="openNewPerson()">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Nouvelle personne -->
<div class="sbg" id="person-bg" onclick="closeSheet('person-bg',event)">
  <div class="sheet">
    <div class="shandle"></div>
    <div class="stitle" id="person-title">Nouvelle personne</div>
    <div class="field"><label>Prénom / Surnom</label><input type="text" id="p-name" placeholder="ex: Alex, Maman..."/></div>
    <button class="bfull" onclick="savePerson()">Ajouter</button>
    <button class="bcancel" onclick="closeSheet('person-bg')">Annuler</button>
  </div>
</div>

<!-- Nouvelle dette -->
<div class="sbg" id="debt-bg" onclick="closeSheet('debt-bg',event)">
  <div class="sheet">
    <div class="shandle"></div>
    <div class="stitle" id="debt-title">Nouvelle avance</div>
    <div class="info-box" id="debt-info"></div>
    <div class="field"><label>Description</label><input type="text" id="d-label" placeholder="ex: Produit X, Commande..."/></div>
    <div class="row2">
      <div class="field"><label>Prix annoncé (€)</label><input type="number" id="d-price" placeholder="0.00" step="0.01" inputmode="decimal"/></div>
      <div class="field"><label>Coût réel (€)</label><input type="number" id="d-cost" placeholder="0.00" step="0.01" inputmode="decimal"/></div>
    </div>
    <div class="field"><label>Note (optionnel)</label><input type="text" id="d-note" placeholder="ex: livraison le 15..."/></div>
    <button class="bfull" onclick="saveDebt()">Enregistrer</button>
    <button class="bcancel" onclick="closeSheet('debt-bg')">Annuler</button>
  </div>
</div>

<!-- Remboursement -->
<div class="sbg" id="pay-bg" onclick="closeSheet('pay-bg',event)">
  <div class="sheet">
    <div class="shandle"></div>
    <div class="stitle">Remboursement</div>
    <div class="info-box" id="pay-info"></div>
    <div class="field"><label>Montant reçu (€)</label><input type="number" id="pay-amount" placeholder="0.00" step="0.01" inputmode="decimal"/></div>
    <button class="bfull green" onclick="savePayment()">Confirmer le remboursement</button>
    <button class="bcancel" onclick="closeSheet('pay-bg')">Annuler</button>
  </div>
</div>

<script>
const DB = 'dettes_v1';
let state = { persons: [] };
let editPersonIdx = null;
let activePersonId = null;
let editDebtId = null;
let payDebtId = null;

// ── TAB NAV ──
let curTab = 'dettes';
let dateFilter = 'all';

function showTab(name) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('nb-' + name).classList.add('active');
  curTab = name;
  if (name === 'coffre') renderCoffre();
  // FAB only on dettes tab
  document.querySelector('.fab').style.display = name === 'dettes' ? 'flex' : 'none';
}

// ── COFFRE ──
function allDates() {
  // Collect unique dates from all debts
  const dates = new Set();
  state.persons.forEach(p => (p.debts || []).forEach(d => { if (d.date) dates.add(d.date); }));
  return [...dates].sort((a, b) => {
    // Parse fr date dd/mm/yyyy
    const pa = a.split('/').reverse().join('-');
    const pb = b.split('/').reverse().join('-');
    return pb.localeCompare(pa); // newest first
  });
}

function renderCoffre() {
  const dates = allDates();

  // Date chips
  const chipsEl = document.getElementById('date-chips');
  chipsEl.innerHTML = `<button class="dchip ${dateFilter==='all'?'active':''}" onclick="setDateFilter('all')">Tout</button>` +
    dates.map(d => `<button class="dchip ${dateFilter===d?'active':''}" onclick="setDateFilter('${d}')">${d}</button>`).join('');

  // Per-person cost summary
  const el = document.getElementById('coffre-list');
  const persons = state.persons.map(p => {
    const debts = (p.debts || []).filter(d => dateFilter === 'all' || d.date === dateFilter);
    const totalCost = debts.reduce((s, d) => s + parseFloat(d.cost || 0), 0);
    const totalPrice = debts.reduce((s, d) => s + parseFloat(d.price || 0), 0);
    const margin = totalPrice - totalCost;
    return { p, debts, totalCost, totalPrice, margin };
  }).filter(x => x.debts.length > 0 || dateFilter === 'all');

  if (!persons.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">🗝</div>Aucune donnée pour cette période.</div>';
    return;
  }

  // Find max cost for bar proportions
  const maxCost = Math.max(...persons.map(x => x.totalCost), 0.01);

  // Global totals
  const grandCost = persons.reduce((s, x) => s + x.totalCost, 0);
  const grandMargin = persons.reduce((s, x) => s + x.margin, 0);

  el.innerHTML = `
    <div class="mcard wide" style="margin-bottom:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div class="mlabel">Coût total avancé</div><div class="mval cr">${fmtM(grandCost)} €</div></div>
        <div><div class="mlabel">Bénéfice potentiel</div><div class="mval cg">+${fmtM(grandMargin)} €</div></div>
      </div>
    </div>` +
    persons.sort((a,b) => b.totalCost - a.totalCost).map(({p, debts, totalCost, totalPrice, margin}) => {
      const barPct = maxCost > 0 ? (totalCost / maxCost * 100).toFixed(1) : 0;
      const debtLines = debts.map(d =>
        `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:.5px solid var(--border)">
          <span style="color:var(--muted)">${d.label} <span style="color:var(--faint);font-size:10px">${d.date}</span></span>
          <span style="font-family:'DM Mono',monospace;color:var(--red)">${fmtM(d.cost)} €</span>
        </div>`
      ).join('');
      return `<div class="coffre-person">
        <div class="cp-row">
          <div><div class="cp-name">${p.name}</div><div class="cp-detail">${debts.length} avance${debts.length!==1?'s':''} · marge <span style="color:var(--green)">+${fmtM(margin)} €</span></div></div>
          <div class="cp-cost">${fmtM(totalCost)} €</div>
        </div>
        <div class="cp-bar-wrap"><div class="cp-bar" style="width:${barPct}%"></div></div>
        <div style="margin-top:10px">${debtLines}</div>
      </div>`;
    }).join('');
}

function setDateFilter(val) {
  dateFilter = val;
  renderCoffre();
}

// ── BACKUP ──
function exportBackup() {
  const data = { version:1, exportDate: new Date().toISOString(), persons: state.persons };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toLocaleDateString('fr-FR').replace(/\//g,'-');
  a.href = url; a.download = 'dettes-backup-' + d + '.json'; a.click();
  URL.revokeObjectURL(url);
}
function importBackup(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.persons) { alert('Fichier invalide.'); return; }
      const nb = data.persons.reduce((s,p) => s + (p.debts||[]).length, 0);
      if (!confirm('Importer ce backup ?\n\n' + data.persons.length + ' personnes · ' + nb + ' avances\nExporté le : ' + (data.exportDate ? new Date(data.exportDate).toLocaleDateString('fr-FR') : '?') + '\n\n⚠️ Remplace toutes vos données actuelles.')) return;
      state.persons = data.persons;
      save(); render();
      alert('✅ Importé avec succès !');
    } catch(err) { alert('Erreur de lecture du fichier.'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ── BACKUP ──
function exportBackup() {
  const data = {
    version: 1,
    exportDate: new Date().toISOString(),
    persons: state.persons
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toLocaleDateString('fr-FR').replace(/\//g, '-');
  a.href = url;
  a.download = 'dettes-backup-' + d + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.persons) { alert('Fichier invalide.'); return; }
      const np = data.persons.length;
      const nd = data.persons.reduce((s, p) => s + (p.debts||[]).length, 0);
      const date = data.exportDate ? new Date(data.exportDate).toLocaleDateString('fr-FR') : '?';
      if (!confirm('Importer ce backup ?\n\n' + np + ' personnes · ' + nd + ' avances\nExporté le : ' + date + '\n\n⚠️ Cela remplacera toutes vos données actuelles.')) return;
      state.persons = data.persons;
      save();
      render();
      if (curTab === 'coffre') renderCoffre();
      alert('✅ Importé avec succès !');
    } catch(err) {
      alert('Erreur de lecture du fichier.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function load() {
  try {
    const d = localStorage.getItem(DB);
    if (d) { const s = JSON.parse(d); state.persons = s.persons || []; }
  } catch(e) {}
  render();
}
function save() { try { localStorage.setItem(DB, JSON.stringify(state)); } catch(e) {} }

function fmtM(n) { return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt(n) { return parseFloat(n||0).toFixed(2); }
function nowStr() {
  const n = new Date();
  return n.toLocaleDateString('fr-FR');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── Computed ──
function personStats(p) {
  let totalDue = 0, totalCost = 0, totalPaid = 0;
  (p.debts || []).forEach(d => {
    totalDue += parseFloat(d.price || 0);
    totalCost += parseFloat(d.cost || 0);
    totalPaid += parseFloat(d.paid || 0);
  });
  const remaining = totalDue - totalPaid;
  const margin = totalDue - totalCost;
  return { totalDue, totalCost, totalPaid, remaining, margin };
}

// ── Render ──
function render() {
  renderMetrics();
  renderPersons();
  renderCoffre();
  updateHdr();
}

function updateHdr() {
  const active = state.persons.filter(p => personStats(p).remaining > 0);
  document.getElementById('hsub').textContent =
    `${state.persons.length} personne${state.persons.length!==1?'s':''} · ${active.length} dette${active.length!==1?'s':''} en cours`;
}

function renderMetrics() {
  let totalDue = 0, totalCost = 0, totalPaid = 0;
  state.persons.forEach(p => {
    const s = personStats(p);
    totalDue += s.totalDue;
    totalCost += s.totalCost;
    totalPaid += s.totalPaid;
  });
  const remaining = totalDue - totalPaid;
  const margin = totalDue - totalCost;
  document.getElementById('metrics').innerHTML = `
    <div class="mcard wide"><div class="mlabel">Reste à récupérer</div><div class="mval cy">${fmtM(remaining)} €</div></div>
    <div class="mcard"><div class="mlabel">Bénéfice potentiel</div><div class="mval cg">+${fmtM(margin)} €</div></div>
    <div class="mcard"><div class="mlabel">Déjà remboursé</div><div class="mval">${fmtM(totalPaid)} €</div></div>
  `;
}

function renderPersons() {
  const el = document.getElementById('persons-list');
  if (!state.persons.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">👤</div>Aucune personne.<br>Appuie sur <strong>+</strong> pour en ajouter une.</div>`;
    return;
  }
  // Sort: people with remaining debt first
  const sorted = [...state.persons].sort((a,b) => personStats(b).remaining - personStats(a).remaining);
  el.innerHTML = sorted.map(p => personHTML(p)).join('');
}

function personHTML(p) {
  const s = personStats(p);
  const isPaid = s.remaining <= 0 && (p.debts||[]).length > 0;
  const hasDebts = (p.debts||[]).length > 0;
  const isOpen = p._open;

  const debtsHTML = (p.debts || []).map(d => debtRowHTML(p.id, d)).join('');

  return `<div class="person-card" id="pc-${p.id}">
    <div class="person-header" onclick="togglePerson('${p.id}')">
      <div>
        <div class="person-name ${isPaid?'person-paid':''}">${p.name}</div>
        <div class="person-meta">${(p.debts||[]).length} avance${(p.debts||[]).length!==1?'s':''} · remboursé ${fmtM(s.totalPaid)} €</div>
        <div class="expand-btn">${isOpen?'▲ Réduire':'▼ Détails'}</div>
      </div>
      <div class="person-totals">
        <div class="person-due ${isPaid?'cg':''}">${isPaid?'✓ Soldé':fmtM(s.remaining)+' €'}</div>
        ${s.margin > 0 ? `<div class="person-margin">+${fmtM(s.margin)} € marge</div>` : ''}
      </div>
    </div>
    <div class="debts-list ${isOpen?'open':''}" id="dl-${p.id}">
      ${debtsHTML || '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">Aucune avance.</div>'}
      <div class="person-actions">
        <button class="pact-btn add" onclick="openNewDebt('${p.id}')">+ Avance</button>
        ${s.remaining > 0 ? `<button class="pact-btn pay" onclick="openPayment('${p.id}')">💰 Rembours.</button>` : ''}
        <button class="pact-btn del" onclick="deletePerson('${p.id}')">Supprimer</button>
      </div>
    </div>
  </div>`;
}

function debtRowHTML(personId, d) {
  const price = parseFloat(d.price || 0);
  const cost = parseFloat(d.cost || 0);
  const paid = parseFloat(d.paid || 0);
  const remaining = price - paid;
  const margin = price - cost;
  const isFullyPaid = remaining <= 0;
  const isPartial = paid > 0 && !isFullyPaid;

  return `<div class="debt-row">
    <div>
      <div class="debt-label">${d.label}</div>
      <div class="debt-note">${d.date}${d.note?' · '+d.note:''}</div>
      ${isFullyPaid ? '<span class="paid-badge">Remboursé</span>' : isPartial ? `<span class="partial-badge">Partial · reste ${fmtM(remaining)} €</span>` : ''}
    </div>
    <div>
      <div class="debt-amount ${isFullyPaid?'cg':''}">${fmtM(price)} €</div>
      <div class="debt-cost">Coût : ${fmtM(cost)} €</div>
      ${margin > 0 ? `<div class="debt-margin">+${fmtM(margin)} €</div>` : ''}
      <div class="debt-status">
        <button class="ibtn cy" onclick="openEditDebt('${personId}','${d.id}')" title="Modifier"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="ibtn cr" onclick="deleteDebt('${personId}','${d.id}')" title="Supprimer"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
      </div>
    </div>
  </div>`;
}

function togglePerson(id) {
  const p = state.persons.find(x => x.id === id);
  if (!p) return;
  p._open = !p._open;
  render();
}

// ── Persons CRUD ──
function openNewPerson() {
  editPersonIdx = null;
  document.getElementById('p-name').value = '';
  document.getElementById('person-title').textContent = 'Nouvelle personne';
  document.getElementById('person-bg').classList.add('open');
  setTimeout(() => document.getElementById('p-name').focus(), 300);
}
function savePerson() {
  const name = document.getElementById('p-name').value.trim();
  if (!name) { alert('Prénom obligatoire.'); return; }
  if (editPersonIdx !== null) {
    state.persons[editPersonIdx].name = name;
  } else {
    state.persons.push({ id: uid(), name, debts: [], _open: true });
  }
  save(); closeSheet('person-bg'); render();
}
function deletePerson(id) {
  const p = state.persons.find(x => x.id === id);
  if (!confirm(`Supprimer ${p.name} et toutes ses dettes ?`)) return;
  state.persons = state.persons.filter(x => x.id !== id);
  save(); render();
}

// ── Debts CRUD ──
function openNewDebt(personId) {
  activePersonId = personId;
  editDebtId = null;
  const p = state.persons.find(x => x.id === personId);
  document.getElementById('debt-title').textContent = `Avance pour ${p.name}`;
  document.getElementById('debt-info').innerHTML = `<strong>${p.name}</strong> — nouvelle avance`;
  document.getElementById('d-label').value = '';
  document.getElementById('d-price').value = '';
  document.getElementById('d-cost').value = '';
  document.getElementById('d-note').value = '';
  document.getElementById('debt-bg').classList.add('open');
}
function openEditDebt(personId, debtId) {
  activePersonId = personId;
  editDebtId = debtId;
  const p = state.persons.find(x => x.id === personId);
  const d = (p.debts || []).find(x => x.id === debtId);
  if (!d) return;
  document.getElementById('debt-title').textContent = 'Modifier l\'avance';
  document.getElementById('debt-info').innerHTML = `<strong>${p.name}</strong> — modification`;
  document.getElementById('d-label').value = d.label;
  document.getElementById('d-price').value = d.price;
  document.getElementById('d-cost').value = d.cost;
  document.getElementById('d-note').value = d.note || '';
  document.getElementById('debt-bg').classList.add('open');
}
function saveDebt() {
  const label = document.getElementById('d-label').value.trim();
  const price = parseFloat(document.getElementById('d-price').value || 0);
  const cost = parseFloat(document.getElementById('d-cost').value || 0);
  const note = document.getElementById('d-note').value.trim();
  if (!label) { alert('Description obligatoire.'); return; }
  const p = state.persons.find(x => x.id === activePersonId);
  if (!p) return;
  if (editDebtId) {
    const d = p.debts.find(x => x.id === editDebtId);
    if (d) { d.label = label; d.price = price; d.cost = cost; d.note = note; }
  } else {
    p.debts.push({ id: uid(), label, price, cost, note, paid: 0, date: nowStr() });
  }
  save(); closeSheet('debt-bg'); render();
}
function deleteDebt(personId, debtId) {
  if (!confirm('Supprimer cette avance ?')) return;
  const p = state.persons.find(x => x.id === personId);
  if (!p) return;
  p.debts = p.debts.filter(d => d.id !== debtId);
  save(); render();
}

// ── Payment ──
function openPayment(personId) {
  activePersonId = personId;
  const p = state.persons.find(x => x.id === personId);
  const s = personStats(p);
  document.getElementById('pay-info').innerHTML =
    `<strong>${p.name}</strong><br/>Reste dû : <strong style="color:var(--accent)">${fmtM(s.remaining)} €</strong>`;
  document.getElementById('pay-amount').value = fmt(s.remaining);
  document.getElementById('pay-bg').classList.add('open');
}
function savePayment() {
  const amount = parseFloat(document.getElementById('pay-amount').value || 0);
  if (!amount || amount <= 0) { alert('Montant invalide.'); return; }
  const p = state.persons.find(x => x.id === activePersonId);
  if (!p) return;
  // Distribute payment across unpaid debts (oldest first)
  let remaining = amount;
  p.debts.forEach(d => {
    if (remaining <= 0) return;
    const due = parseFloat(d.price || 0) - parseFloat(d.paid || 0);
    if (due <= 0) return;
    const apply = Math.min(due, remaining);
    d.paid = parseFloat(d.paid || 0) + apply;
    remaining -= apply;
  });
  save(); closeSheet('pay-bg'); render();
}

// ── Sheets ──
function closeSheet(id, e) {
  if (!e || e.target === document.getElementById(id)) {
    document.getElementById(id).classList.remove('open');
  }
}


// ── Navigation ──
function showTab(name, btn) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}

// ── Coffre ──
function renderCoffre() {
  const el = document.getElementById('coffre-list');
  const totalEl = document.getElementById('coffre-grand-total');
  if (!el) return;

  // Only persons with at least one debt
  const active = state.persons.filter(p => (p.debts||[]).length > 0);
  if (!active.length) {
    el.innerHTML = '<div class="empty-coffre">🏦<br/><br/>Aucune avance enregistrée.</div>';
    totalEl.textContent = '0,00 €';
    return;
  }

  // Sort by total cost desc
  const withStats = active.map(p => {
    const totalCost = (p.debts||[]).reduce((s,d) => s + parseFloat(d.cost||0), 0);
    const totalPrice = (p.debts||[]).reduce((s,d) => s + parseFloat(d.price||0), 0);
    const margin = totalPrice - totalCost;
    return { p, totalCost, totalPrice, margin };
  }).sort((a,b) => b.totalCost - a.totalCost);

  const grandTotal = withStats.reduce((s,x) => s + x.totalCost, 0);
  totalEl.textContent = fmtM(grandTotal) + ' €';

  el.innerHTML = withStats.map(({ p, totalCost, totalPrice, margin }) => {
    const pct = grandTotal > 0 ? (totalCost / grandTotal * 100) : 0;
    const debtRows = (p.debts||[]).map(d => `
      <div class="coffre-debt-row">
        <span class="coffre-debt-label">${d.label}</span>
        <span class="coffre-debt-cost">${fmtM(d.cost)} €</span>
      </div>`).join('');

    return `<div class="coffre-card">
      <div class="coffre-row">
        <div class="coffre-name">${p.name}</div>
        <div class="coffre-cost">${fmtM(totalCost)} €</div>
      </div>
      <div class="coffre-bar-wrap"><div class="coffre-bar" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="coffre-detail">${debtRows}</div>
      <div class="coffre-margin-row">
        <span class="coffre-margin-label">Marge sur ${p.name}</span>
        <span class="coffre-margin-val ${margin < 0 ? 'cr' : ''}">${margin >= 0 ? '+' : ''}${fmtM(margin)} €</span>
      </div>
    </div>`;
  }).join('');
}

load();
</script>
</body>
</html>
